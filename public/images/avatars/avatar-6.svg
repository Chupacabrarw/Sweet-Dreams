<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-moon)" stroke="#ffffff" stroke-width="3"/>
  <!-- Sparkles -->
  <path d="M24 35 Q26 29 32 29 Q26 29 24 23 Q22 29 16 29 Q22 29 24 35 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M96 75 Q98 71 102 71 Q98 71 96 67 Q94 71 90 71 Q94 71 96 75 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="86" cy="30" r="2.5" fill="#fff"/>
  <circle cx="34" cy="85" r="2" fill="#fff"/>
  <!-- Floating Cloud below -->
  <ellipse cx="65" cy="94" rx="36" ry="16" fill="#ffffff" opacity="0.9"/>
  <circle cx="50" cy="88" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="75" cy="86" r="16" fill="#ffffff" opacity="0.9"/>
  <!-- Crescent Moon Character -->
  <path d="M48 24 A 36 36 0 1 0 76 92 A 38 38 0 0 1 48 24 Z" fill="url(#moon-grad)"/>
  <!-- Sleeping Eye on Moon Face -->
  <path d="M48 56 Q53 60 58 56" stroke="#5c3826" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M57 56 L59 54" stroke="#5c3826" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Sweet Smile -->
  <path d="M52 66 Q56 69 60 66" stroke="#b04664" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Rosy Cheek -->
  <ellipse cx="46" cy="62" rx="4.5" ry="3" fill="#f43f5e" opacity="0.5"/>
  <!-- Nightcap on top tip of Moon -->
  <path d="M48 24 Q60 12 78 18 Q86 28 88 40 Q76 34 66 30 Z" fill="#d44d6e"/>
  <!-- Cap rim -->
  <ellipse cx="58" cy="27" rx="13" ry="5" fill="#ffffff"/>
  <!-- Cap pompom -->
  <circle cx="88" cy="40" r="6" fill="#ffffff"/>
</svg>
