<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-swan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdbe5"/>
      <stop offset="100%" stop-color="#f59eb7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-swan)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="25" cy="35" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="95" cy="40" r="2.5" fill="#fff" opacity="0.8"/>
  <!-- Swan Body / Water Ripple Base -->
  <ellipse cx="60" cy="98" rx="42" ry="16" fill="rgba(255,255,255,0.4)"/>
  <path d="M30 92 C30 75 50 78 68 84 C85 78 92 90 90 98 C75 106 45 106 30 92 Z" fill="#ffffff"/>
  <!-- Wing Feather Details -->
  <path d="M48 82 C55 78 68 82 72 88" stroke="#fbd0dc" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M42 88 C52 84 64 88 68 94" stroke="#fbd0dc" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Graceful S-Curved Neck & Head -->
  <path d="M68 84 C68 62 48 54 48 42 C48 34 56 30 64 30 C72 30 74 38 72 44 C70 54 80 66 78 84 Z" fill="#ffffff"/>
  <!-- Golden Tiara Crown -->
  <path d="M57 28 L55 20 L60 23 L65 18 L70 23 L75 20 L73 28 Z" fill="#fcd34d" stroke="#f59e0b" stroke-width="1"/>
  <!-- Sleeping Eye with Eyelash -->
  <path d="M62 38 Q67 41 71 38" stroke="#4a3036" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M70 38 L72 36" stroke="#4a3036" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Beak -->
  <polygon points="73,38 84,40 73,43" fill="#f59e0b"/>
  <!-- Mask at beak base -->
  <polygon points="71,37 74,38 74,42 71,43" fill="#2d2226"/>
  <!-- Blush -->
  <ellipse cx="63" cy="42" rx="4" ry="2.5" fill="#ff7e9e" opacity="0.6"/>
  <!-- Rose flowers near chest -->
  <circle cx="56" cy="68" r="4" fill="#eb708e"/>
  <circle cx="62" cy="70" r="3.5" fill="#f48da8"/>
  <circle cx="50" cy="71" r="3" fill="#fda4af"/>
</svg>
