# Render Blueprint — Sweet Dreams (free web service + MySQL eksternal di Aiven)
# Render Dashboard → New → Blueprint → pilih repo ini. Variabel bertanda
# sync: false diisi manual saat pertama kali deploy (lihat DEPLOY-RENDER.md).
services:
  - type: web
    name: sweet-dreams
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Sweet Dreams
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: id
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # Database MySQL (Aiven free)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log

      # Pembayaran QRIS (teks hasil scan QR toko)
      - key: QRIS_PAYLOAD
        sync: false
      - key: QRIS_EXPIRY_MINUTES
        value: "1440"

      # Ongkir & chatbot
      - key: RAJAONGKIR_API_KEY
        sync: false
      - key: RAJAONGKIR_BASE_URL
        value: https://rajaongkir.komerce.id/api/v1
      - key: RAJAONGKIR_ORIGIN_CITY_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
